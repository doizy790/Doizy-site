<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>DOIZY | Official</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:relative;z-index:1;padding:24px;display:flex;justify-content:space-between;border-bottom:1px solid #ff222233}
.logo{font-size:24px;font-weight:900;letter-spacing:5px;color:#ff3030;text-shadow:0 0 20px #ff2020}
.status{font-size:10px;color:#ff4444;letter-spacing:2px;align-self:center}
main{position:relative;z-index:1;min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px 20px}
.panel{width:100%;max-width:720px}
.tag{color:#ff3333;letter-spacing:5px;font-size:11px;margin-bottom:25px}
h1{font-size:clamp(64px,17vw,130px);letter-spacing:8px;text-shadow:0 0 12px #ff2020,0 0 45px #a00000;animation:glow 2s infinite alternate}
@keyframes glow{to{text-shadow:0 0 25px #ff2222,0 0 75px #a00000}}
.line{width:100px;height:2px;background:#ff2222;margin:25px auto;box-shadow:0 0 15px #ff2222}
p{color:#aaa;font-size:13px;letter-spacing:3px;line-height:2.2}
button{margin:25px 6px 0;padding:14px 22px;background:#ff2020;color:white;border:1px solid #ff2020;font-weight:bold;letter-spacing:2px;cursor:pointer}
button:hover{background:transparent;box-shadow:0 0 22px #ff202077}
#message{margin-top:22px;color:#ff5555;font-size:13px;min-height:20px}
footer{position:relative;z-index:1;text-align:center;padding:24px;color:#555;font-size:10px;letter-spacing:2px;border-top:1px solid #ff222222}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<header><div class="logo">DOIZY.</div><div class="status">● SYSTEM ONLINE</div></header>
<main><div class="panel">
<div class="tag">WELCOME TO MY WORLD</div>
<h1>DOIZY</h1><div class="line"></div>
<p>INDEPENDENT MIND.<br>DIGITAL WORLD. OWN RULES.</p>
<button onclick="explore()">EXPLORE</button>
<button onclick="activate()">ACTIVATE</button>
<div id="message">Sistem hazır. Komutunu bekliyor...</div>
</div></main>
<footer>© 2026 DOIZY — BUILT DIFFERENT.</footer>
<script>
const c=document.getElementById('matrix'),x=c.getContext('2d');let drops=[];
function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.ceil(c.width/18)).fill(1)}
addEventListener('resize',resize);resize();
function draw(){x.fillStyle='rgba(5,5,5,.15)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff2424';x.font='14px monospace';drops.forEach((y,i)=>{x.fillText(Math.random()>.5?'1':'0',i*18,y*18);if(y*18>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(draw)}draw();
function explore(){document.getElementById('message').textContent='DOIZY // Kendi yolunu çiz. Kendi dünyanı oluştur.'}
function activate(){document.getElementById('message').textContent='DOIZY SYSTEM ACTIVATED ✓';document.body.style.boxShadow='inset 0 0 70px #ff151544';setTimeout(()=>document.body.style.boxShadow='none',1000)}
</script>
</body>
</html>
